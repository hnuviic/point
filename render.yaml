# Blueprint для Render.com — статика на REG.RU, API здесь.
# Деплой: Dashboard → New → Blueprint → подключить репозиторий GitHub.
services:
  - type: web
    name: point-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGINS
        value: https://pointdiscovery.online,https://www.pointdiscovery.online
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: DB_PATH
        value: /opt/render/project/src/data.sqlite
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
